name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, development, develop ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master, development, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── 1. Continuous Integration (Lint, Test, Audit) ───────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pip-audit

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 cps test --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all style warnings non-fatally
          flake8 cps test --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

      - name: Run unit & integration tests
        run: python -m unittest discover -s test

      - name: Run security audit
        run: pip-audit
        continue-on-error: true

  # ── 2. Build & Publish Container Image ─────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Continuous Deployment (CD) ──────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: build-and-push
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check VPS Secrets
        id: check_deploy
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ]; then
            echo "has_vps=true" >> $GITHUB_OUTPUT
          else
            echo "has_vps=false" >> $GITHUB_OUTPUT
            echo "VPS_HOST secret not configured. Container image is ready in GHCR: ghcr.io/${{ github.repository }}:latest"
          fi

      - name: Deploy via SSH (Targeted Docker Compose)
        if: steps.check_deploy.outputs.has_vps == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "Deploying latest image on production server..."
            cd /opt/thclabs
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Targeted deployment: ONLY pull and restart this service
            docker compose pull calibre-web
            docker compose up -d calibre-web
            docker image prune -f
            echo "Deployment completed successfully."