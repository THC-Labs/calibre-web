# ==============================================================================
# Docker Compose - Local Development Environment
# Run with: docker compose -f docker-compose.dev.yml up --build
# ==============================================================================

services:
  calibre-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thclabs-calibre-web-dev
    restart: unless-stopped
    ports:
      # Map host port (default 8083) to container internal port 8083
      - "${PORT:-8083}:8083"
    env_file:
      - .env.development
    environment:
      - ENVIRONMENT=development
      - NODE_ENV=development
      - APP_MODE=development
      - PORT=8083
      - CALIBRE_PORT=8083
      - CALIBRE_DBPATH=/app
    volumes:
      # Live reload: bind mount host code into container
      - ./cps:/app/cps
    command: ["python", "cps.py"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
